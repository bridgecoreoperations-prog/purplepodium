<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PurplePodium Lda · Lisboa</title>
<meta name="description" content="PurplePodium Lda – management, consultancy, training and sports & wellness events. Lisbon, Portugal.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#FBF9FD; --surface:#F1EAF7; --ink:#241433; --muted:#5E4F6E;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#170C22; --surface:#22132F; --ink:#F2EAFB; --muted:#B9A8CC;
    --purple:#B38AE8; --purple-2:#7E51B8; --purple-3:#4A2A6E; --line:#3A2650;
  }
}
:root[data-theme="dark"]{
  --bg:#170C22; --surface:#22132F; --ink:#F2EAFB; --muted:#B9A8CC;
  --purple:#B38AE8; --purple-2:#7E51B8; --purple-3:#4A2A6E; --line:#3A2650;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.125rem;line-height:1.65}
h1,h2,h3,.sans{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;line-height:1.15;margin:0 0 1.25rem;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700;margin:0 0 .35rem}
p{margin:0 0 1rem}
a{color:var(--purple)}
:focus-visible{outline:3px solid var(--purple-2);outline-offset:3px;border-radius:4px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.5rem}
.narrow{max-width:40rem}

/* language switch */
.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:flex-end;
  padding:.75rem 1.5rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.lang div{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.lang button{font:600 .85rem/1 "Bricolage Grotesque",Arial,sans-serif;border:0;background:none;color:var(--muted);
  padding:.5rem .8rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--purple);color:var(--bg)}

/* hero with podium */
.hero{padding:2.5rem 0 0;overflow:hidden}
.hero h1{font-size:clamp(2.8rem,10vw,6.2rem);font-weight:800;line-height:.95;letter-spacing:-.035em;margin:0 0 1.25rem;color:var(--purple)}
.hero .lead{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(1.2rem,2.6vw,1.55rem);font-weight:500;line-height:1.35;max-width:34rem;margin-bottom:.9rem}
.hero .sub{color:var(--muted);max-width:36rem}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;margin-top:2.75rem;height:clamp(150px,26vw,240px)}
.podium span{display:flex;align-items:flex-start;justify-content:center;padding-top:.6rem;
  font:800 clamp(1.4rem,4vw,2.4rem)/1 "Bricolage Grotesque",Arial,sans-serif;color:var(--bg);border-radius:6px 6px 0 0}
.podium .p2{height:68%;background:var(--purple-2)}
.podium .p1{height:100%;background:var(--purple)}
.podium .p3{height:46%;background:var(--purple-3);color:var(--purple)}

section{padding:4.5rem 0;border-top:1px solid var(--line)}
section.first{border-top:0}
.tinted{background:var(--surface)}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:2.25rem 3rem}
.services div{border-left:3px solid var(--purple);padding-left:1rem}
.services p{color:var(--muted);margin:0}

.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2rem 3rem}
.team .role{font-family:"Bricolage Grotesque",Arial,sans-serif;color:var(--purple);font-weight:600;font-size:.95rem;margin-bottom:.5rem}
.team p{color:var(--muted)}

dl{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:.9rem 1.5rem;margin:0}
dt{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:600;color:var(--muted);font-size:.98rem}
dd{margin:0}
@media (max-width:540px){dl{grid-template-columns:1fr;gap:.15rem}dd{margin-bottom:.9rem}}

.contact .btn{display:inline-block;margin-top:.5rem;background:var(--purple);color:var(--bg);text-decoration:none;
  font:600 1rem/1 "Bricolage Grotesque",Arial,sans-serif;padding:1rem 1.4rem;border-radius:8px;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:2rem 3rem}
.steps .n{display:block;font:800 2.4rem/1 "Bricolage Grotesque",Arial,sans-serif;color:var(--purple-2);margin-bottom:.6rem}
.steps p{color:var(--muted);margin:0}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;margin-top:1.75rem}
.places div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem}
.places strong{display:block;font:700 1.25rem/1.2 "Bricolage Grotesque",Arial,sans-serif;color:var(--purple);margin-bottom:.2rem}
.places span{color:var(--muted);font-size:1rem}
footer{padding:2rem 0 2.5rem;color:var(--muted);font-size:.95rem;border-top:1px solid var(--line)}
</style>
</head>
<body>

<nav class="lang" aria-label="Language">

      <span class="p2">2</span><span class="p1">1</span><span class="p3">3</span>

  <section class="first tinted">
    <div class="wrap narrow">

      <p data-i="about2"></p>
    </div>
  </section>

  <section>
    <div class="wrap">

        <div><h3 data-i="s1t"></h3><p data-i="s1"></p></div>
        <div><h3 data-i="s2t"></h3><p data-i="s2"></p></div>
        <div><h3 data-i="s3t"></h3><p data-i="s3"></p></div>
        <div><h3 data-i="s4t"></h3><p data-i="s4"></p></div>
      </div>
    </div>
  </section>

  <section class="tinted">
    <div class="wrap">
      <h2 data-i="howT"></h2>
      <div class="steps">
        <div><span class="n">01</span><h3 data-i="h1t"></h3><p data-i="h1"></p></div>
        <div><span class="n">02</span><h3 data-i="h2t"></h3><p data-i="h2"></p></div>
        <div><span class="n">03</span><h3 data-i="h3t"></h3><p data-i="h3"></p></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">

      <div class="team">
        <div>
          <h3>Thomas</h3>
          <div class="role" data-i="roleM"></div>
          <p data-i="thomas"></p>
        </div>
        <div>
          <h3>Oleksandra</h3>
          <div class="role" data-i="roleF"></div>
          <p data-i="oleks"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="tinted">
    <div class="wrap">
      <h2 data-i="whereT"></h2>
      <p class="narrow" data-i="where"></p>
      <div class="places">
        <div><strong data-i="c1"></strong><span data-i="c1s"></span></div>
        <div><strong data-i="c2"></strong><span data-i="c2s"></span></div>
        <div><strong data-i="c3"></strong><span data-i="c3s"></span></div>
      </div>
    </div>
  </section>

  <section class="contact">
    <div class="wrap narrow">
      <h2 data-i="contactT"></h2>
      <p data-i="contact"></p>
      <a class="btn" href="#" id="mailbtn" data-i="btn"></a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" data-i="foot"></div>
</footer>

const btns=document.querySelectorAll('[data-set]');
function setLang(l){
  if(!T[l]) l='en';
  document.documentElement.lang=l;

  btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===l));
  try{localStorage.setItem('pp-lang',l)}catch(e){}
}
btns.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.set)));

.podium .p3{height:46%;background:var(--purple-3);color:var(--purple)}

section{padding:4.5rem 0;border-top:1px solid var(--line)}
section.first{border-top:0}
.tinted{background:var(--surface)}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:2.25rem 3rem}
.services div{border-left:3px solid var(--purple);padding-left:1rem}
.services p{color:var(--muted);margin:0}

.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2rem 3rem}
.team .role{font-family:"Bricolage Grotesque",Arial,sans-serif;color:var(--purple);font-weight:600;font-size:.95rem;margin-bottom:.5rem}
.team p{color:var(--muted)}

dl{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:.9rem 1.5rem;margin:0}
dt{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:600;color:var(--muted);font-size:.98rem}
dd{margin:0}
@media (max-width:540px){dl{grid-template-columns:1fr;gap:.15rem}dd{margin-bottom:.9rem}}

.contact .btn{display:inline-block;margin-top:.5rem;background:var(--purple);color:var(--bg);text-decoration:none;
  font:600 1rem/1 "Bricolage Grotesque",Arial,sans-serif;padding:1rem 1.4rem;border-radius:8px;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:2rem 3rem}
.steps .n{display:block;font:800 2.4rem/1 "Bricolage Grotesque",Arial,sans-serif;color:var(--purple-2);margin-bottom:.6rem}
.steps p{color:var(--muted);margin:0}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;margin-top:1.75rem}
.places div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem}
.places strong{display:block;font:700 1.25rem/1.2 "Bricolage Grotesque",Arial,sans-serif;color:var(--purple);margin-bottom:.2rem}
.places span{color:var(--muted);font-size:1rem}
footer{padding:2rem 0 2.5rem;color:var(--muted);font-size:.95rem;border-top:1px solid var(--line)}
</style>
</head>

const btns=document.querySelectorAll('[data-set]');
function setLang(l){

}
